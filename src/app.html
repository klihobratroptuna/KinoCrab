<html lang="ru">

<head>

	<meta charset="utf-8" />

	<meta name="theme-color" content="#13161B" />
	<meta name="mobile-web-app-capable" content="yes" />

	<!-- Прочее -->
	<!-- Шрифт Inter (352 КБ) без preload стартует только после расшифровки CSS. Preload
		 даёт ему качаться одновременно со страницей. font-display: swap уже стоит, поэтому
		 первый экран рисуется системным шрифтом и шрифт не блокирует отрисовку. -->
	<link rel="preload" as="font" href="%sveltekit.assets%/fonts/InterVariable.woff2" type="font/woff2" crossorigin />
	<style>
		* {
			font-family: "Inter", system-ui !important;
		}
	</style>
	<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

</head>

<body data-sveltekit-preload-data="hover">
