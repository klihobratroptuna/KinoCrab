  # СЃС‚СЂР°РЅРёС†Р° С‡РёС‚Р°РµС‚ С‚РѕР»СЊРєРѕ Р±Р°Р·Сѓ, Р° РїСЂРѕРІРµСЂРєРё РґРµР»Р°РµС‚ СЌС‚РѕС‚ СЃРµСЂРІРёСЃ РєР°Р¶РґС‹Рµ 30 РјРёРЅСѓС‚.
  # РЎРµСЂРІРёСЃ РІС‹Р·С‹РІР°РµС‚ С‚Сѓ Р¶Рµ С„СѓРЅРєС†РёСЋ РѕС‚Р±РѕСЂР°, С‡С‚Рѕ Рё Р±Р»РѕРє (src/lib/shared/seriesSource),
