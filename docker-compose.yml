  # Фоновый наполнитель карусели «Фильмы». Страница читает только базу, проверки делает
  # этот сервис каждые 30 минут. Замер 2026-11-06: чтение готового снимка — 5 мс, один
  # проход пула (до 150 кандидатов Kodik, пауза 700 мс) — около трёх минут; раньше каждое
  # открытие вкладки ждало эти минуты и каждый раз расходовало квоту источников.
  # Первый живой проход того же дня: проверено 49 кандидатов, карточек 2, 47 без плеера.
  # Это следствие правила-гейта — в ленте только тайтлы, которые находят наши плееры, и
  # лента растёт по мере появления рипов, а не по списку популярности.
  # Сервис вызывает ту же функцию отбора, что и блок (src/lib/shared/movieSource), поэтому
  # правила одна: пул TMDB popular страницы 1–3 плюс окно премьер 2025-01-01…сегодня,
