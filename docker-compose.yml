  # (СЃР°Р№С‚ РЅРµ РѕС‚РґР°С‘С‚ CORS-Р·Р°РіРѕР»РѕРІРєРё Рё Р±Р»РѕРєРёСЂСѓРµС‚ Р°РІС‚РѕРјР°С‚РёС‡РµСЃРєРёРµ Р·Р°РїСЂРѕСЃС‹), РїРѕСЌС‚РѕРјСѓ РґР°РЅРЅС‹Рµ РїРёС€РµС‚
