      PB_PASSWORD: ${PB_PASSWORD}
      NET_BASE: http://web/
      KINOPOISK_API_KEY: ${KINOPOISK_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
      KODIK_TOKEN: ${KODIK_TOKEN}
